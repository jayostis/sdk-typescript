name: CI

on:
  push:
    # Integration branches too, not only main. A merge into epic/** is a push to
    # a non-main branch, so nothing ran on it: #9 and #17 were both checked as
    # pull requests and the branch they landed on was never tested as a whole.
    #
    # Takes effect immediately once merged — a push trigger is read from the
    # workflow file on the branch being pushed, unlike workflow_dispatch, which
    # is only offered from the default branch.
    branches: [main, 'epic/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor of the declared engines range, plus current LTS. The floor
        # rose from 18 to 20 with #95: Node 18 has no globalThis.crypto without
        # a flag, and the only way to keep the identity module's random
        # fallback synchronous and browser-safe there was Math.random.
        node-version: ['20.x', '22.x']

    steps:
      - name: Check out sdk-typescript
        uses: actions/checkout@v4
        with:
          path: sdk-typescript

      # Several suites resolve shared fixtures at <parent>/conformance/fixtures/
      # via resolve(__dirname, '../../conformance/fixtures'), so conformance must
      # be a SIBLING of this checkout rather than a subdirectory. Note the failure
      # mode if this step is removed: readdirSync throws at collection time, so the
      # run fails loudly rather than quietly skipping the fixture-backed tests.
      # TEMPORARY: points at the FORK, not the-cascade-protocol/conformance.
      # The fixtures this SDK is being written against are ahead of the org:
      # jayostis/conformance#1 retyped coverage-001 from clinical:CoverageRecord
      # to coverage:InsurancePlan, and sdk-typescript#26 asserts the new spelling.
      # Against the org's copy that assertion fails on a fixture that is correct
      # locally, so CI would go red for a reason that is not about this code.
      # REVERT to the-cascade-protocol/conformance once the fork is merged
      # upstream — until then CI does not tell us whether this SDK still works
      # against what everyone else has.
      - name: Check out conformance as a sibling
        uses: actions/checkout@v4
        with:
          repository: jayostis/conformance
          path: conformance

      # The shapes the SHACL suites judge against, at the revision conformance
      # pinned. Read from conformance/scripts/SPEC_PIN rather than pinned again
      # here: these fixtures were verified against that exact commit, so reading
      # spec at any other revision judges them against a spec nobody ran them
      # on. Cloned rather than checked out with actions/checkout because a
      # checkout cannot express "the commit that file names".
      #
      # `set -euo pipefail` matters: without it a failed grep leaves COMMIT
      # empty, `git checkout ""` is a no-op, and the job would judge against
      # whatever the default branch happens to be — green, and against the wrong
      # shapes.
      #
      # CASCADE_SPEC_DIR is the first name tests/support/spec-sources.ts looks
      # at; the ../spec sibling it falls back to is for a developer's local
      # layout and is deliberately not created here.
      - name: Check out the pinned spec revision
        run: |
          set -euo pipefail
          COMMIT="$(grep '^commit=' conformance/scripts/SPEC_PIN | cut -d= -f2)"
          REPO_URL="$(grep '^repo=' conformance/scripts/SPEC_PIN | cut -d= -f2)"
          echo "Pinned spec commit: ${COMMIT}"
          git clone --quiet "${REPO_URL}.git" "${RUNNER_TEMP}/spec"
          git -C "${RUNNER_TEMP}/spec" checkout --quiet "${COMMIT}"
          echo "CASCADE_SPEC_DIR=${RUNNER_TEMP}/spec" >> "$GITHUB_ENV"

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      # npm ci, never a node_modules symlink: a symlinked node_modules resolves
      # packages back to whatever tree it points at, which silently invalidates
      # everything the suite then claims to have tested.
      - name: Install
        working-directory: sdk-typescript
        run: npm ci

      # `src/spec/` is derived from the spec checkout and gitignored. Each of
      # the four steps below has a `pre` hook that generates it, so a bare
      # `npm test` on a fresh clone works. Run through those hooks here, an
      # unchanged checkout was regenerated four times per job at ~6 s each,
      # so it is generated once, as a named step, and the four steps below
      # pass --ignore-scripts, which skips a script's pre/post hooks and
      # nothing else — the script named still runs.
      - name: Generate
        working-directory: sdk-typescript
        run: npm run generate

      - name: Build
        working-directory: sdk-typescript
        run: npm run build --ignore-scripts

      # vitest transpiles without typechecking and tsconfig.json excludes test
      # files, so a type-level assertion in a test is invisible to both `npm
      # test` and `npm run build`. This step is what makes the @ts-expect-error
      # assertions on narrowed public types real.
      - name: Typecheck
        working-directory: sdk-typescript
        run: npm run typecheck --ignore-scripts

      # D-BROWSER-1: the public entry point MUST bundle and run for a browser
      # target. This does what a consumer's Vite or webpack build does — start
      # at src/index.ts, follow every static import, resolve for a browser — and
      # fails on any `node:` builtin, `createRequire` or CommonJS `require()` on
      # the way; then compiles src/ with Node's types withheld
      # (tsconfig.browser.json) and fails on a bare `process`, `Buffer`,
      # `__dirname` or `global` in any .ts or .js under src/ — the vendored
      # n3 included, which is where a re-vendor would bring one in — since a
      # bundler passes those through in silence.
      # `tests/browser-bundle.test.ts` then executes the bundle where
      # no Node global exists; this step is the same verdict, one line, named in
      # the job log so a red run says "browser" before anyone opens the test.
      - name: Browser bundle
        working-directory: sdk-typescript
        run: npm run check:browser --ignore-scripts

      - name: Test
        working-directory: sdk-typescript
        run: npm test --ignore-scripts

